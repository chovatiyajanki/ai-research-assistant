services:
  db:
    image: postgres:16-alpine
    container_name: ai-research-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_assistant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_assistant_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-research-assistant-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_assistant_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      SQL_ECHO: ${SQL_ECHO:-false}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-all-MiniLM-L6-v2}
      GROQ_API_KEY: ${GROQ_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-llama-3.3-70b-versatile}
      WARM_EMBEDDING_MODEL_ON_STARTUP: ${WARM_EMBEDDING_MODEL_ON_STARTUP:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      VECTORSTORE_DIR: /app/vectorstore
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/vectorstore:/app/vectorstore
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
